name: Verificar app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run spec:validate
      - run: npm run build
      - run: npm run build:landing
      - name: Construir y probar contenedores aislados
        run: npm run test:docker
      - name: Registrar versión verificada
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          printf 'Commit verificado (sin despliegue): `%s`\n' "$VERIFIED_SHA" >> "$GITHUB_STEP_SUMMARY"
