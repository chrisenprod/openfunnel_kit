name: Publicar app

# This workflow runs from the default branch, never from pull request code.
on:
  workflow_run:
    workflows: [Verificar app]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# A newer CI run must not interrupt an active deployment or its rollback.
concurrency:
  group: production-app
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://app.openfunnel.mocca.cl
    steps:
      # No checkout or upstream artifacts run in this job with production access.
      - name: Publicar commit verificado mediante SSH restringido
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.VPS_HOST }}
          DEPLOY_PORT: ${{ vars.VPS_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ && "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset DEPLOY_KEY KNOWN_HOSTS
          ssh -T -i "$ssh_dir/key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "openfunnel-deploy@$DEPLOY_HOST" "deploy $DEPLOY_SHA $CI_RUN_ID"
          printf 'Publicación comprobada: `%s` · https://app.openfunnel.mocca.cl\n' "$DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
