server {
    listen 80;
    listen [::]:80;
    server_name openfunnel.mocca.cl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://openfunnel.mocca.cl$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openfunnel.mocca.cl;

    ssl_certificate /etc/letsencrypt/live/openfunnel.mocca.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openfunnel.mocca.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/openfunnel/current;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache";

    access_log /var/log/nginx/openfunnel.access.log;
    error_log /var/log/nginx/openfunnel.error.log;

    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ =404; }
}
