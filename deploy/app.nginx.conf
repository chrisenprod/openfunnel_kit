worker_processes auto;
pid /tmp/nginx.pid;
# Request-level upstream errors can include query tokens; use the sanitized access log.
error_log /dev/stderr crit;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Do not log query strings, cookies or webhook bodies.
    log_format app '$remote_addr $request_method $uri $status';
    access_log /dev/stdout app;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 1m;
    client_body_timeout 15s;
    send_timeout 30s;
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;

        # A variable upstream is resolved again after API container replacement.
        set $api_upstream http://api:3001;
        location ~ ^/api(?:/|$) {
            proxy_pass $api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_send_timeout 30s;
            proxy_next_upstream off;
        }
        location ~ /\. { return 404; }
        # Navigation uses hashes; missing resources must not return index.html.
        location / { try_files $uri $uri/ =404; }
    }
}
