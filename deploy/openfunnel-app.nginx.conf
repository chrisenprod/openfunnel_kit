# Loaded inside the host Nginx http context. Keep query tokens out of logs.
log_format openfunnel_app '$remote_addr $request_method $uri $status';
limit_req_zone $binary_remote_addr zone=openfunnel_login:1m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name app.openfunnel.mocca.cl;
    access_log /var/log/nginx/openfunnel-app.access.log openfunnel_app;
    error_log /var/log/nginx/openfunnel-app.error.log crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://app.openfunnel.mocca.cl$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.openfunnel.mocca.cl;
    ssl_certificate /etc/letsencrypt/live/app.openfunnel.mocca.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.openfunnel.mocca.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    server_tokens off;
    client_max_body_size 5m;
    client_body_timeout 15s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/openfunnel-app.access.log openfunnel_app;
    error_log /var/log/nginx/openfunnel-app.error.log crit;

    location = /api/login {
        limit_req zone=openfunnel_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/openfunnel-app-proxy.conf;
    }
    location / { include /etc/nginx/snippets/openfunnel-app-proxy.conf; }
}
